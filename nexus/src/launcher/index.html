<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Engineering OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #71717a;
      --accent: #3b82f6;
      --accent-dim: rgba(59,130,246,0.15);
      --radius: 12px;
    }

    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .status-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.offline { background: #ef4444; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      align-self: flex-start;
      width: 100%;
      max-width: 860px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 860px;
      margin-bottom: 40px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-card:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .app-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-icon {
      font-size: 28px;
      line-height: 1;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
    }

    .app-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .app-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      align-self: flex-start;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    kbd {
      background: var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nexus <span>Engineering OS</span></h1>
    <p>Your engineering tools, unified.</p>
  </header>

  <div class="status-bar">
    <div class="status-dot" id="plm-dot"></div>
    <span id="plm-status">Checking PLM connection…</span>
    <span style="margin-left:auto" class="kbd">Open PLM: <kbd>Alt</kbd><kbd>P</kbd></span>
  </div>

  <div class="section-label">Design &amp; CAD</div>
  <div class="app-grid" id="cad-grid"></div>

  <div class="section-label">PLM &amp; Asset Management</div>
  <div class="app-grid" id="plm-grid"></div>

  <footer>
    <span class="kbd"><kbd>Alt</kbd><kbd>1–6</kbd> Quick launch</span>
    <span id="nexus-version"></span>
  </footer>

  <script src="launcher.js"></script>
</body>
</html>
